<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SNS風日記 - ToolsHub</title>
    <link rel="stylesheet" href="./styles.css">
</head>

<body>
    <main class="diary-app">
        <header class="diary-header">
            <div>
                <a class="back-link" href="./index.html">ToolsHubへ戻る</a>
                <h1>SNS風日記</h1>
                <p class="lead">入力内容はこの端末のブラウザに保存されます。投稿した日時は自動で記録されます。</p>
            </div>
        </header>

        <section class="diary-composer" aria-label="日記を投稿">
            <form id="diary-form">
                <label for="diary-text">いまの記録</label>
                <textarea id="diary-text" name="diary-text" rows="5" placeholder="今日あったこと、考えたこと、残しておきたいこと"></textarea>
                <div class="diary-actions">
                    <p id="storage-status" role="status" aria-live="polite">保存先: この端末</p>
                    <button type="submit">投稿</button>
                </div>
            </form>
        </section>

        <section class="diary-timeline" aria-label="日記一覧">
            <div class="section-title-row">
                <h2>タイムライン</h2>
                <button id="clear-diary" class="secondary-button" type="button">全削除</button>
            </div>
            <div id="diary-list" class="posts"></div>
        </section>
    </main>

    <template id="diary-post-template">
        <article class="post">
            <div class="post-meta">
                <strong>自分</strong>
                <time></time>
            </div>
            <p></p>
            <button class="delete-post" type="button">削除</button>
        </article>
    </template>

    <script>
        const STORAGE_KEY = "toolshub-diary-posts";
        const form = document.querySelector("#diary-form");
        const textarea = document.querySelector("#diary-text");
        const list = document.querySelector("#diary-list");
        const template = document.querySelector("#diary-post-template");
        const clearButton = document.querySelector("#clear-diary");
        const storageStatus = document.querySelector("#storage-status");

        const setStorageStatus = (message) => {
            storageStatus.textContent = message;
        };

        const isValidPost = (post) => {
            return post !== null &&
                typeof post === "object" &&
                typeof post.id === "string" &&
                post.id.length > 0 &&
                typeof post.text === "string" &&
                post.text.trim().length > 0 &&
                typeof post.createdAt === "string" &&
                !Number.isNaN(Date.parse(post.createdAt));
        };

        const loadPosts = () => {
            try {
                const stored = JSON.parse(localStorage.getItem(STORAGE_KEY) ?? "[]");

                if (!Array.isArray(stored)) {
                    setStorageStatus("保存データの形式が不正です。新しい投稿から再開できます。");
                    return [];
                }

                const posts = stored.filter(isValidPost);
                if (posts.length !== stored.length) {
                    setStorageStatus("一部の保存データを読み込めませんでした。");
                }
                return posts;
            } catch {
                setStorageStatus("保存データを読み込めません。新しい投稿から再開できます。");
                return [];
            }
        };

        const savePosts = (posts) => {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(posts));
                setStorageStatus("保存先: この端末");
                return true;
            } catch {
                setStorageStatus("保存できません。ブラウザの保存領域を確認してください。");
                return false;
            }
        };

        const formatDate = (isoDate) => {
            return new Intl.DateTimeFormat("ja-JP", {
                dateStyle: "medium",
                timeStyle: "short"
            }).format(new Date(isoDate));
        };

        const renderPosts = () => {
            const posts = loadPosts();
            list.replaceChildren();

            if (posts.length === 0) {
                const empty = document.createElement("p");
                empty.className = "empty-state";
                empty.textContent = "まだ投稿はありません。";
                list.append(empty);
                return;
            }

            for (const post of posts) {
                const node = template.content.firstElementChild.cloneNode(true);
                node.dataset.id = post.id;
                node.querySelector("time").dateTime = post.createdAt;
                node.querySelector("time").textContent = formatDate(post.createdAt);
                node.querySelector("p").textContent = post.text;
                node.querySelector(".delete-post").addEventListener("click", () => {
                    const nextPosts = loadPosts().filter((item) => item.id !== post.id);
                    if (savePosts(nextPosts)) {
                        renderPosts();
                    }
                });
                list.append(node);
            }
        };

        form.addEventListener("submit", (event) => {
            event.preventDefault();
            const text = textarea.value.trim();

            if (!text) {
                textarea.focus();
                return;
            }

            const posts = loadPosts();
            posts.unshift({
                id: crypto.randomUUID(),
                text,
                createdAt: new Date().toISOString()
            });
            if (!savePosts(posts)) {
                return;
            }
            textarea.value = "";
            renderPosts();
        });

        clearButton.addEventListener("click", () => {
            if (confirm("日記をすべて削除しますか？")) {
                if (savePosts([])) {
                    renderPosts();
                }
            }
        });

        renderPosts();
    </script>
</body>

</html>
